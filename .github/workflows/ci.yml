name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, audit, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — ruff
        run: ruff check .

      - name: Format check — black
        run: black --check .

      - name: Dependency vulnerability audit — pip-audit
        # PYSEC-2025-183 (CVE-2025-45768) is a disputed "weak encryption"
        # report against pyjwt. Upstream rejects it because key length is
        # the application's responsibility, not the library's. DIVE only
        # pulls pyjwt in transitively via PyGithub and never generates JWTs
        # itself (we authenticate to GitHub with personal access tokens),
        # so the disputed code path is unreachable. Revisit if the
        # advisory status changes or pyjwt ships a real fix.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-183

      - name: Unit tests — pytest
        run: pytest tests/ -v --ignore=tests/integration

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Create a minimal config.yaml so the build doesn't fail on its absence
      # (the Dockerfile deletes it, but the COPY . . step needs the file absent
      # from the build context — .dockerignore handles that)
      - name: Build Docker image
        run: docker build -t dive:ci .
