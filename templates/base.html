<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="run-token" content="{{ run_token }}">
  <title>{% block title %}DIVE{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    /* Apply saved theme before first paint to avoid flash */
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<header class="page-header">
  <span class="brand">DIVE</span>
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" onclick="toggleNav()">&#9776;</button>
  <span class="status-dot idle" id="status-dot" style="display:none"></span>
  <span class="status-text" id="status-text"></span>
  <span class="next-run-text" id="next-run-text"></span>
  <span class="header-spacer"></span>
  <span class="ollama-dot" id="ollama-dot" title="Ollama: checking…"></span>
  <span class="model-chip" id="model-chip">{{ current_model }}</span>
  <button class="btn-theme" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode">☀</button>
  <button class="btn btn-primary btn-sm" id="run-now-btn" onclick="triggerRun()">&#9654; Run Now</button>
</header>

<nav class="site-nav" id="site-nav">
  <a href="/"         class="{{ 'active' if nav_active == 'dashboard' else '' }}">Dashboard</a>
  <a href="/findings" class="{{ 'active' if nav_active == 'findings'  else '' }}">Findings</a>
  <a href="/news"     class="{{ 'active' if nav_active == 'news'      else '' }}">News</a>
  <a href="/secrets"  class="{{ 'active' if nav_active == 'secrets'   else '' }}">Secrets</a>
  <a href="/history"  class="{{ 'active' if nav_active == 'history'   else '' }}">History</a>
  <a href="/weekly"   class="{{ 'active' if nav_active == 'weekly'    else '' }}">Weekly</a>
  <a href="/personal" class="{{ 'active' if nav_active == 'personal'  else '' }}">Personal</a>
  <a href="/settings" class="{{ 'active' if nav_active == 'settings'  else '' }}">Settings</a>
  <a href="/logout" class="nav-logout" title="Log out">Log out</a>
</nav>

<main class="page-main">
  {% block content %}{% endblock %}
</main>

<footer class="page-footer">
  DIVE — DIVE &nbsp;·&nbsp;
  <a href="https://github.com/your-org/dive" target="_blank" rel="noopener">GitHub</a>
</footer>

<div id="toast"></div>

<script>
/* ── Theme ───────────────────────────────────────────── */
function _applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀' : '☾';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  _applyTheme(next);
}

// Apply correct icon on load (theme was already set before paint)
_applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

/* ── Mobile nav ─────────────────────────────────────── */
function toggleNav() {
  document.getElementById('site-nav').classList.toggle('nav-open');
}

/* ── Shared helpers ──────────────────────────────────── */
const RUN_TOKEN = document.querySelector('meta[name="run-token"]').content;

/* apiFetch — like fetch() but auto-injects X-Run-Token on mutations */
function apiFetch(url, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const headers = Object.assign({}, options.headers);
  if (method !== 'GET' && method !== 'HEAD') {
    headers['X-Run-Token'] = RUN_TOKEN;
  }
  return fetch(url, Object.assign({ credentials: 'same-origin' }, options, { headers }));
}

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show toast-' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3500);
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff / 60)   + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600)  + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function timeUntil(iso) {
  const diff = (new Date(iso).getTime() - Date.now()) / 1000;
  if (diff <= 0)     return 'soon';
  if (diff < 3600)   return 'in ' + Math.ceil(diff / 60)   + 'm';
  if (diff < 86400)  return 'in ' + Math.floor(diff / 3600) + 'h';
  return 'in ' + Math.floor(diff / 86400) + 'd';
}

/* ── Pipeline status polling ─────────────────────────── */
function updateStatusBadge(pipeline) {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  const btn  = document.getElementById('run-now-btn');
  dot.style.display = '';

  if (pipeline.running) {
    dot.className = 'status-dot running';
    text.textContent = 'Running…';
    btn.disabled = true;
  } else if (pipeline.last_status === 'success') {
    dot.className = 'status-dot success';
    const ago = pipeline.last_completed ? timeAgo(pipeline.last_completed) : '—';
    text.textContent = 'Last run ' + ago;
    btn.disabled = false;
  } else if (pipeline.last_status === 'error') {
    dot.className = 'status-dot error';
    text.textContent = 'Last run failed';
    btn.disabled = false;
  } else {
    dot.className = 'status-dot idle';
    text.textContent = 'Never run';
    btn.disabled = false;
  }
}

function pollStatus() {
  fetch('/api/health')
    .then(r => r.json())
    .then(data => {
      updateStatusBadge(data.pipeline);

      const nr = document.getElementById('next-run-text');
      nr.textContent = data.next_run ? '· next run ' + timeUntil(data.next_run) : '';

      const od = document.getElementById('ollama-dot');
      if (data.ollama_ok === true) {
        od.className = 'ollama-dot ollama-ok';
        od.title = 'Ollama: running';
      } else if (data.ollama_ok === false) {
        od.className = 'ollama-dot ollama-err';
        od.title = 'Ollama: unavailable';
      }
    })
    .catch(() => {});
}

let _pollTimer = setInterval(pollStatus, 5000);
pollStatus();

/* ── Run Now ─────────────────────────────────────────── */
function triggerRun() {
  const btn = document.getElementById('run-now-btn');
  btn.disabled = true;
  fetch('/api/run', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'X-Run-Token': RUN_TOKEN }
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'started') {
      showToast('Pipeline started', 'success');
      clearInterval(_pollTimer);
      _pollTimer = setInterval(pollStatus, 2000);
      setTimeout(() => {
        clearInterval(_pollTimer);
        _pollTimer = setInterval(pollStatus, 5000);
      }, 60000);
    } else if (data.status === 'already_running') {
      showToast('Pipeline is already running', 'info');
      btn.disabled = false;
    } else {
      showToast(data.message || 'Unknown response', 'info');
      btn.disabled = false;
    }
  })
  .catch(() => {
    showToast('Failed to trigger run', 'error');
    btn.disabled = false;
  });
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
