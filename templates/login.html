<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — DIVE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
    .login-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:2rem 2rem 1.75rem;
      width:min(380px,100%);
      box-shadow:var(--shadow);
    }
    .login-brand {
      font-size:1.7rem;
      font-weight:800;
      letter-spacing:-0.5px;
      color:var(--text);
      margin-bottom:0.2rem;
    }
    .login-sub {
      font-size:0.8rem;
      color:var(--text-dim);
      margin-bottom:1.75rem;
    }
    .login-field { margin-bottom:1rem; }
    .login-field label {
      display:block;
      font-size:0.78rem;
      color:var(--text-dim);
      margin-bottom:0.35rem;
      font-weight:500;
    }
    .login-field input {
      width:100%;
      box-sizing:border-box;
      background:var(--surface-2);
      border:1px solid var(--border);
      color:var(--text);
      border-radius:var(--radius);
      padding:0.6rem 0.75rem;
      font-size:0.9rem;
      font-family:inherit;
      transition:border-color 0.15s;
    }
    .login-field input:focus {
      outline:none;
      border-color:var(--accent);
    }
    .login-error {
      background:rgba(220,60,60,0.12);
      border:1px solid var(--critical);
      border-radius:var(--radius);
      padding:0.55rem 0.75rem;
      font-size:0.82rem;
      color:var(--critical);
      margin-bottom:1.1rem;
    }
    .login-btn { width:100%; padding:0.65rem; font-size:0.9rem; margin-top:0.25rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">DIVE</div>
  <div class="login-sub">Dependency Intelligence for Vulnerability Exposure</div>

  {% if error %}
  <div class="login-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next_url" value="{{ next_url }}">

    <div class="login-field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autofocus autocomplete="username" required spellcheck="false">
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-primary login-btn">Log in</button>
  </form>
</div>
</body>
</html>
