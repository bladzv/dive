<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — DIVE</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/inter-latin-400-normal.woff2">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .login-head {
      text-align: center;
      margin-bottom: 1.4rem;
    }
    .login-brand {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-bright);
      margin: 0;
    }
    .login-sub {
      margin-top: 0.3rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* Floating label: the label sits inside the input like a placeholder at
       rest, then floats up into the input's top padding on focus or once
       filled. Requires input to carry placeholder=" " so :placeholder-shown
       reflects real emptiness, and the label to be the input's very next
       sibling so the `input:focus + label` / `:not(:placeholder-shown) +
       label` adjacency selectors match — see the markup below. */
    .login-field { position: relative; margin-bottom: 1.3rem; }
    .login-field input { max-width: 100%; padding-top: 0.85rem; padding-bottom: 0.25rem; }
    .login-field label {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      pointer-events: none;
      transition: top 0.2s var(--ease-glide), transform 0.2s var(--ease-glide),
                  font-size 0.2s var(--ease-glide), color 0.2s var(--ease-glide);
    }
    .login-field input:focus + label,
    .login-field input:not(:placeholder-shown) + label,
    .login-field input:-webkit-autofill + label,
    .login-field input:autofill + label {
      top: 0.6rem;
      transform: translateY(-50%) scale(0.78);
      color: var(--accent);
    }

    /* Password field with mask/unmask toggle */
    .login-pw-wrap {
      position: relative;
    }
    .login-pw-wrap input { padding-right: 2.4rem; }
    .pw-toggle {
      position: absolute;
      top: 50%;
      right: 0.35rem;
      transform: translateY(-50%);
      width: 1.8rem;
      height: 1.8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .pw-toggle:hover {
      color: var(--text-bright);
      background: var(--hover);
      border-color: var(--border);
    }
    .pw-toggle svg { width: 16px; height: 16px; }

    .login-error {
      margin-bottom: 1rem;
      padding: 0.55rem 0.75rem;
      background: var(--critical-bg);
      border: 1px solid color-mix(in srgb, var(--critical) 40%, var(--border));
      border-radius: var(--radius);
      color: var(--critical);
      font-size: 0.82rem;
    }
    .login-btn { width: 100%; margin-top: 0.4rem; }

    /* Retriggerable shake: applied to the whole card on a server-rendered
       auth failure (see the conditional class below), and to a single
       .login-field on a client-side blank-submit — see the reflow trick in
       the script, which is what lets the same class fire twice in a row. */
    @keyframes shake-x {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .login-card.shake,
    .login-field.shake {
      animation: shake-x 0.45s var(--ease-shake) both;
    }
    .login-field input[aria-invalid="true"] {
      border-color: var(--critical);
    }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.9 4.3A10 10 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.5 3.6"/>
      <path d="M6.6 6.6A18 18 0 0 0 2 12s3.5 8 10 8a10 10 0 0 0 4.5-1.1"/>
      <path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/>
      <path d="M2 2l20 20"/>
    </symbol>
  </defs>
</svg>

<div class="login-card{{ ' shake' if error else '' }}">
  <div class="login-head">
    <h1 class="login-brand">DIVE</h1>
    <p class="login-sub">Dependency Intelligence for Vulnerability Exposure</p>
  </div>

  {% if error %}
  <div class="login-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <div class="login-field">
      <input type="text" id="username" name="username" placeholder=" "
             autofocus autocomplete="username" required spellcheck="false"
             {% if error %}aria-invalid="true"{% endif %}>
      <label for="username">Username</label>
    </div>
    <div class="login-field">
      <div class="login-pw-wrap">
        <input type="password" id="password" name="password" placeholder=" "
               autocomplete="current-password" required
               {% if error %}aria-invalid="true"{% endif %}>
        <label for="password">Password</label>
        <button type="button" class="pw-toggle" id="pw-toggle"
                aria-label="Show password" aria-pressed="false"
                onclick="togglePassword()">
          <svg id="pw-icon" aria-hidden="true"><use href="#i-eye"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary login-btn">Sign in</button>
  </form>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.getElementById('pw-toggle');
  const icon = document.getElementById('pw-icon');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  btn.setAttribute('aria-pressed', showing ? 'false' : 'true');
  icon.innerHTML = '<use href="#' + (showing ? 'i-eye' : 'i-eye-off') + '"/>';
}

// This page loads without static/app.js (pre-auth, kept deliberately
// standalone — see CLAUDE.md), so its motion/validation JS is self-contained
// rather than reusing window.DIVE helpers.
(function () {
  var form = document.querySelector('form');
  if (!form) return;

  // A blank required field fires the browser's native 'invalid' event before
  // 'submit' — preventDefault() there suppresses the native validation
  // bubble so our shake is the only feedback, and the field-level (not
  // whole-card) shake keeps the signal localized to the actual problem.
  // 'invalid' doesn't bubble, so each input needs its own listener; when
  // BOTH fields are blank the browser fires 'invalid' on each of them for
  // the same submit attempt, in DOM order — this flag keeps focus on only
  // the first one, matching native single-field-focus behavior, while every
  // invalid field still gets its own shake + aria-invalid.
  var focusedThisAttempt = false;
  form.querySelectorAll('.login-field input[required]').forEach(function (input) {
    input.addEventListener('invalid', function (e) {
      e.preventDefault();
      var field = input.closest('.login-field');
      input.setAttribute('aria-invalid', 'true');
      field.classList.remove('shake');
      void field.offsetWidth; // reflow, so re-adding the class retriggers the CSS animation
      field.classList.add('shake');
      if (!focusedThisAttempt) {
        focusedThisAttempt = true;
        input.focus();
        setTimeout(function () { focusedThisAttempt = false; }, 0);
      }
    });
    input.addEventListener('input', function () {
      input.removeAttribute('aria-invalid');
      var field = input.closest('.login-field');
      field.classList.remove('shake');
    });
  });

  // Only reached once every field passes constraint validation, so this is
  // exactly the "valid submit" case — the loading state never shows for a
  // submit the browser is about to block.
  form.addEventListener('submit', function () {
    var btn = form.querySelector('.login-btn');
    if (btn) btn.classList.add('is-loading');
  });
})();
</script>
</body>
</html>
